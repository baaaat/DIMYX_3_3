plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.dimyx.representation'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.dimyx.representation'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    sourceSets {
        main {
            // Les sources restent dans android/src/main afin de conserver le
            // prototype déjà livré et d’éviter une copie des fichiers.
            manifest.srcFile '../src/main/AndroidManifest.xml'
            java.srcDirs = ['../src/main/java']
            res.srcDirs = ['../src/main/res']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
